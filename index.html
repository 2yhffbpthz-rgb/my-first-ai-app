<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My First AI App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f14;
      color: #e8e6f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 2rem;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    header p {
      color: #7c7a8e;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .setup-box {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }

    .setup-box label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    .setup-box input {
      width: 100%;
      background: #0f0f14;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e8e6f0;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .setup-box input:focus { border-color: #a78bfa; }
    .setup-box input::placeholder { color: #3e3e58; }

    .setup-box .hint {
      font-size: 0.78rem;
      color: #4e4e68;
      margin-top: 8px;
    }

    .chat-window {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 14px;
      width: 100%;
      max-width: 640px;
      min-height: 360px;
      max-height: 420px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 14px;
      scroll-behavior: smooth;
    }

    .chat-window::-webkit-scrollbar { width: 4px; }
    .chat-window::-webkit-scrollbar-thumb { background: #2e2e42; border-radius: 4px; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: #3e3e58;
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.88rem; }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .message.user .avatar { background: linear-gradient(135deg, #a78bfa, #60a5fa); }
    .message.ai .avatar   { background: #2e2e42; }

    .bubble {
      max-width: 78%;
      padding: 11px 15px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #4c35a0, #2563a8);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.ai .bubble {
      background: #22222e;
      color: #d4d2e0;
      border-bottom-left-radius: 3px;
      border: 1px solid #2e2e42;
    }

    .typing { display: flex; gap: 5px; padding: 4px 0; }
    .typing span {
      width: 7px; height: 7px;
      background: #7c7a8e;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .input-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 640px;
    }

    .input-row input {
      flex: 1;
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 10px;
      padding: 12px 16px;
      color: #e8e6f0;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #a78bfa; }
    .input-row input::placeholder { color: #3e3e58; }

    .input-row button {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .input-row button:hover:not(:disabled) { opacity: 0.88; transform: scale(0.98); }
    .input-row button:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-msg {
      width: 100%;
      max-width: 640px;
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      border-radius: 10px;
      padding: 12px 16px;
      color: #f87171;
      font-size: 0.85rem;
      display: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>✦ My First AI App</h1>
    <p>Powered by Claude — built by me 🚀</p>
  </header>

  <div class="setup-box">
    <label>Your API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-api03-..." />
    <p class="hint">🔒 Your key stays in your browser only — never sent anywhere else.</p>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <p>Enter your API key above, then ask Claude anything!</p>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Ask Claude anything..." />
    <button id="sendBtn" onclick="sendMessage()">Send →</button>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <script>
    const chatWindow = document.getElementById('chatWindow');
    const emptyState = document.getElementById('emptyState');
    const userInput  = document.getElementById('userInput');
    const sendBtn    = document.getElementById('sendBtn');
    const errorMsg   = document.getElementById('errorMsg');
    const apiKeyInput = document.getElementById('apiKey');

    const messages = [];

    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function addMessage(role, text) {
      if (emptyState) emptyState.remove();

      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '🧑' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatWindow.appendChild(wrap);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return bubble;
    }

    function showTyping() {
      if (emptyState && emptyState.parentNode) emptyState.remove();
      const wrap = document.createElement('div');
      wrap.className = 'message ai';
      wrap.id = 'typingIndicator';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatWindow.appendChild(wrap);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typingIndicator');
      if (t) t.remove();
    }

    function showError(msg) {
      errorMsg.textContent = '⚠️ ' + msg;
      errorMsg.style.display = 'block';
      setTimeout(() => errorMsg.style.display = 'none', 5000);
    }

    async function sendMessage() {
      const apiKey = apiKeyInput.value.trim();
      const text   = userInput.value.trim();

      if (!apiKey) { showError('Please enter your API key first.'); return; }
      if (!text)   { showError('Please type a message.'); return; }

      errorMsg.style.display = 'none';
      userInput.value = '';
      sendBtn.disabled = true;

      addMessage('user', text);
      messages.push({ role: 'user', content: text });

      showTyping();

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            messages: messages
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error?.message || 'Something went wrong.');
        }

        const reply = data.content[0].text;
        messages.push({ role: 'assistant', content: reply });

        removeTyping();
        addMessage('ai', reply);

      } catch (err) {
        removeTyping();
        showError(err.message);
      }

      sendBtn.disabled = false;
      userInput.focus();
    }
  </script>
</body>
</html>
